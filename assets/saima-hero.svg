<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Saima Sheikh — Applied AI/ML and Full-Stack Developer</title>
  <desc id="desc">A burgundy and midnight editorial hero banner with technical grid details and subtle animated accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="160" r="250" fill="url(#orb)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#E5B5C7" stroke-opacity="0.16">
    <circle cx="1080" cy="168" r="112" stroke-dasharray="2 10"/>
    <circle cx="1080" cy="168" r="150" stroke-dasharray="1 12"/>
    <path d="M900 168h360M1080 20v296" stroke-opacity="0.12"/>
  </g>
  <path d="M760 270C850 200 885 238 960 154S1095 83 1190 112" fill="none" stroke="#C77B9B" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="9 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-76" dur="8s" repeatCount="indefinite"/>
  </path>
  <circle cx="960" cy="154" r="4" fill="#E5B5C7">
    <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="86" y="77" fill="#C77B9B" font-size="14" font-weight="700" letter-spacing="5">COMPUTER SCIENCE · SOFTWARE ENGINEERING</text>
    <text x="80" y="166" fill="#F8F0F3" font-size="66" font-weight="750" letter-spacing="-2">Saima Sheikh</text>
    <rect x="84" y="190" width="360" height="3" rx="2" fill="url(#glow)"/>
    <text x="86" y="235" fill="#E5B5C7" font-size="23" font-weight="500">Applied AI/ML  ·  Full-Stack  ·  Cloud</text>
    <text x="86" y="279" fill="#F8F0F3" fill-opacity="0.65" font-size="15" letter-spacing="1.1">Turning complex workflows into explainable, useful software.</text>
  </g>
  <g fill="#E5B5C7" fill-opacity="0.65">
    <circle cx="1186" cy="70" r="2"/><circle cx="1220" cy="240" r="2"/><circle cx="875" cy="70" r="1.5"/>
  </g>
  <rect x="1" y="1" width="1278" height="338" rx="24" fill="none" stroke="#C77B9B" stroke-opacity="0.35"/>
</svg>